<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 220px; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .row { display: flex; align-items: center; justify-content: space-between; }
  .label { font-size: 14px; color: #1f2937; }
  .switch { position: relative; width: 40px; height: 22px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; background: #d1d5db; border-radius: 22px; cursor: pointer;
    transition: background 0.2s;
  }
  .slider::before {
    content: ''; position: absolute; width: 16px; height: 16px; left: 3px; bottom: 3px;
    background: white; border-radius: 50%; transition: transform 0.2s;
  }
  input:checked + .slider { background: #3b82f6; }
  input:checked + .slider::before { transform: translateX(18px); }
  .status { margin-top: 12px; font-size: 12px; color: #6b7280; }
  .divider { height: 1px; background: #e5e7eb; margin: 12px 0; }
  .engine { font-size: 11px; color: #9ca3af; }
</style>
</head>
<body>
  <div class="row">
    <span class="label">网页翻译</span>
    <label class="switch">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </div>
  <div class="status" id="status">已关闭</div>
  <div class="divider"></div>
  <div class="row">
    <span class="label">双语对照</span>
    <label class="switch">
      <input type="checkbox" id="bilingual">
      <span class="slider"></span>
    </label>
  </div>
  <div class="status" id="mode-status">纯中文模式</div>
  <div class="divider"></div>
  <div class="engine">Google (主) / Bing (备用)</div>
  <script src="popup.js"></script>
</body>
</html>
